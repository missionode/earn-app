<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="google" content="notranslate">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receive Money - Earn</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/receive.css">
</head>
<body>
    <div class="container">
        <h1>Add Income</h1>
        <form id="receiveForm">

            <div class="form-group">
                <label for="amount">Amount:</label>
                <input type="number" id="amount" name="amount" placeholder="Enter Amount" min="0.01" step="0.01" required>
                <p id="liteAmountHelp" class="field-help" hidden>Automatically calculated from today’s Earn counter × clients.</p>
            </div>

            <div id="detailsToggleReceive" class="form-group switch-container">
                <label class="switch">
                    <input type="checkbox" id="toggleDetailsReceive">
                    <span class="slider round"></span>
                </label>
                <label for="toggleDetailsReceive" class="toggle-label">Show Category & Description</label>
            </div>

            <div id="detailsFieldsReceive">
                <div class="form-group">
                    <label>Category (Optional):</label>
                    <div class="icon-grid">
                        <input type="radio" id="categoryCash" name="category" value="cash">
                        <label for="categoryCash"><img src="assets/icons/cash.svg" alt="Cash"><span>Cash</span></label>

                        <input type="radio" id="categoryRent" name="category" value="rent">
                        <label for="categoryRent"><img src="assets/icons/rent.svg" alt="Rent"><span>Rent</span></label>

                        <input type="radio" id="categorySalary" name="category" value="salary">
                        <label for="categorySalary"><img src="assets/icons/salary.svg" alt="Salary"><span>Salary</span></label>

                        <input type="radio" id="categoryOther" name="category" value="other">
                        <label for="categoryOther"><img src="assets/icons/other.svg" alt="Other"><span>Other</span></label>

                        <input type="radio" id="categorySadhana" name="category" value="sadhana" hidden>
                        <label for="categorySadhana" class="lite-only-category" hidden><img src="assets/icons/namaskar.svg" alt="Sadhana"><span>Sadhana</span></label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Description (Optional):</label>
                    <textarea id="description" placeholder="Enter Description" name="description"></textarea>
                </div>

                <div id="clientsGroup" class="form-group" hidden>
                    <label for="clients">Clients:</label>
                    <input type="number" id="clients" name="clients" value="1" min="1" step="1" inputmode="numeric">
                </div>
            </div>

            <div class="intoaction-buttons">
                <button type="button" id="customReceiptButton" class="button secondary">Add Income</button>
                <button type="submit" class="button primary">Receive with UPI QR</button>
            </div>
        </form>
        <div class="footer-Adv">
            <a id="receiveBackLink" href="index.html" style="position: relative; left: -10px; top:-10px;" class="back-link"><img src="./assets/icons/home-back-arrow.gif" alt="Previous page"></a>
            <figure>
                <!-- <figcaption><p>USE</p></figcaption>
                <img width="100" src="assets/images/wwwc.png" class="responsive-image" alt="works well with cred"> -->
            </figure>
        </div>
    </div>
    <div id="coinRainContainer" aria-hidden="true"></div>
    <script src="js/script.js"></script>
    <script src="js/daily-counter.js?v=39"></script>
    <script src="js/prosperity-celebration.js?v=39"></script>
    <script src="js/receive.js?v=39"></script>
</body>
</html>
