<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="google" content="notranslate">
    <meta name="theme-color" content="#f0f4f8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receive QR Code - Earn</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/receive-qr.css">
</head>
<body>
    <div class="container">
        <h1>Scan to Pay</h1>
        <div id="qrCodeContainer">
            </div>
        <div class="payment-details">
            <p>Amount: <strong><span id="amountDisplay"></span></strong></p>
            <p>Description: <span id="descriptionDisplay"></span></p>
            <p>Payee: <strong id="payeeNameDisplay"></strong></p>
        </div>
        <div class="status-update">
            <button id="doneButton" class="button primary">Recieved Payment</button>
            <button id="cancelButton" class="button primary">Cancelled Transaction</button>
        </div>

        <a id="editPaymentLink" href="receive.html" class="edit-payment-link">← Edit payment details</a>
        <a id="receiveQrBackLink" href="index.html" class="back-link"><img src="./assets/icons/home-back-arrow.gif" alt="Previous page"></a>

        <div hidden class="adrev">
            <figure>
                <img src="assets/images/twct.png" class="cred-advertisement" alt="">
                <figcaption>Earn & Working well with CRED</figcaption>
            </figure>
        </div>
        
    </div>
    <div id="coinRainContainer" aria-hidden="true"></div>
    <script src="https://cdn.jsdelivr.net/npm/easyqrcodejs@4.6.2/dist/easy.qrcode.min.js"></script>
    <script src="js/daily-counter.js?v=40"></script>
    <script src="js/prosperity-celebration.js?v=40"></script>
    <script src="js/receive-qr.js?v=40"></script>
</body>
</html>
